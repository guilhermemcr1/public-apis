services:
  api:
    build:
      context: .
      dockerfile: go/Dockerfile
    image: public-apis-go:local
    restart: unless-stopped
    init: true
    # Sem "ports": o Traefik do Dokploy roteia pelo domínio (Service: api, Port: 8080).
    expose:
      - "8080"
    environment:
      APP_TIMEZONE: America/Sao_Paulo
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      GEOIP_CITY_DATABASE_PATH: /data/geoip/GeoLite2-City.mmdb
      GEOIP_ASN_DATABASE_PATH: /data/geoip/GeoLite2-ASN.mmdb
      GEOIP_RELOAD_INTERVAL: ${GEOIP_RELOAD_INTERVAL:-5m}
    volumes:
      - geoip_data:/data/geoip:ro
    depends_on:
      - geoipupdate

  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:v7.1.1
    restart: unless-stopped
    environment:
      GEOIPUPDATE_EDITION_IDS: GeoLite2-City GeoLite2-ASN
      GEOIPUPDATE_FREQUENCY: "72"
      GEOIPUPDATE_DB_DIR: /usr/share/GeoIP
      GEOIPUPDATE_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID:?defina MAXMIND_ACCOUNT_ID}
      GEOIPUPDATE_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:?defina MAXMIND_LICENSE_KEY}
    volumes:
      - geoip_data:/usr/share/GeoIP

volumes:
  geoip_data:
